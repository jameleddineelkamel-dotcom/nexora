spring.application.name=nexora-procedures

# Secrets locaux : .env.local à la racine de procedures (voir .env.example) ou variables d'environnement
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${PROCEDURES_DB_URL:jdbc:postgresql://localhost:5432/nexora_procedures}
spring.datasource.username=${PROCEDURES_DB_USER:nexora_procedures}
spring.datasource.password=${PROCEDURES_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=${PROCEDURES_PORT:8084}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Authentification unique NEXORA (microservice auth) : jetons vérifiés avec sa clé publique
nexora.auth.url=${AUTH_URL:http://localhost:8090}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8090/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8090}
# Autres services de la plateforme (liens de l'interface, listes de codes)
nexora.refdata.url=${REFDATA_URL:http://localhost:8082}
nexora.eservices.url=${ESERVICES_URL:http://localhost:8085}
nexora.cors.allowed-origins=${PROCEDURES_CORS:http://localhost:4204,http://localhost:4205,http://localhost:8085}

# Amorçage : procédure FIMEX (SFD e-GUCE 3G v1.4) créée en brouillon si absente
nexora.procedures.seed.enabled=${PROCEDURES_SEED:true}

# Agents IA : modèle de langage auto-hébergé, API compatible OpenAI (Ollama, vLLM, LM Studio, llama.cpp, TGI).
# Sans URL ni modèle, ou si le serveur ne répond pas, les agents restent heuristiques et déterministes.
# Exemple Ollama : NEXORA_AI_URL=http://localhost:11434/v1 et NEXORA_AI_MODEL=qwen2.5:7b (dans .env.local)
nexora.ai.url=${NEXORA_AI_URL:}
nexora.ai.model=${NEXORA_AI_MODEL:}
nexora.ai.api-key=${NEXORA_AI_API_KEY:}
nexora.ai.timeout=${NEXORA_AI_TIMEOUT:PT300S}
nexora.ai.max-chars=${NEXORA_AI_MAX_CHARS:20000}

management.endpoints.web.exposure.include=health,info
info.app.name=NEXORA - Studio des procedures (procedures)
info.app.description=Conception des procedures du guichet unique : formulaires, messages, flux, workflow BPMN, regles DRL, agents IA
