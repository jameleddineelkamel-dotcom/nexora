spring.application.name=nexora-refdata

# Secrets locaux : .env.local à la racine de refdata (voir .env.example) ou variables d'environnement
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${REFDATA_DB_URL:jdbc:postgresql://localhost:5432/nexora_refdata?reWriteBatchedInserts=true}
spring.datasource.username=${REFDATA_DB_USER:nexora_refdata}
spring.datasource.password=${REFDATA_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=${REFDATA_PORT:8082}
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB
# Champs numériques / booléens absents du JSON reçu : valeur par défaut (Jackson 3 refuse sinon)
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Exports volumineux (UN/LOCODE : 116 000 lieux)
spring.mvc.async.request-timeout=300s

# Authentification unique NEXORA (microservice auth) : jetons vérifiés avec sa clé publique
nexora.auth.url=${AUTH_URL:http://localhost:8090}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8090/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8090}

# Chargement initial du Référentiel Commun (catalogue + données) si la base est vide
nexora.refdata.seed.enabled=${REFDATA_SEED:true}

management.endpoints.web.exposure.include=health,info
info.app.name=NEXORA - Referentiel Commun (refdata)
info.app.description=Microservice de gestion des tables de reference du commerce exterieur
