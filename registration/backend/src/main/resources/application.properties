spring.application.name=nexora-registration

# Secrets locaux : .env.local à la racine de registration (voir .env.example) ou variables d'environnement
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${REGISTRATION_DB_URL:jdbc:postgresql://localhost:5432/nexora_registration}
spring.datasource.username=${REGISTRATION_DB_USER:nexora_registration}
spring.datasource.password=${REGISTRATION_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=${REGISTRATION_PORT:8083}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Authentification unique NEXORA (microservice auth) : jetons vérifiés avec sa clé publique
nexora.auth.url=${AUTH_URL:http://localhost:8090}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8090/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8090}
nexora.refdata.url=${REFDATA_URL:http://localhost:8082}
nexora.cors.allowed-origins=${REGISTRATION_CORS:http://localhost:4203,http://localhost:4205,http://localhost:8085}

# Opérateurs de démonstration (NIU fictifs) et rattachement des comptes de test, si le registre est vide
nexora.registration.demo=${REGISTRATION_DEMO:true}

management.endpoints.web.exposure.include=health,info
info.app.name=NEXORA - Registration (registre des operateurs)
info.app.description=Enrolement des operateurs economiques : NIU, immatriculations, pieces, comptes rattaches
