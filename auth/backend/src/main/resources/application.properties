spring.application.name=nexora-auth

# Secrets locaux : .env.local à la racine de auth (voir .env.example) ou variables d'environnement
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/nexora_auth}
spring.datasource.username=${AUTH_DB_USER:nexora_auth}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=${AUTH_PORT:8090}
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Émetteur des jetons (URL publique du service), durées de validité
nexora.auth.issuer=${AUTH_ISSUER:http://localhost:8090}
nexora.auth.token-validity=${AUTH_TOKEN_VALIDITY:8h}
nexora.auth.session-validity=${AUTH_SESSION_VALIDITY:10h}
# Origines autorisées pour le retour après connexion (applications de la plateforme)
nexora.auth.redirect-origins=${AUTH_REDIRECT_ORIGINS:http://localhost:4201,http://localhost:8082,http://localhost:4202,http://localhost:8090}
# Mot de passe initial du compte « admin » (créé au premier démarrage si aucun utilisateur n'existe)
nexora.auth.admin-password=${AUTH_ADMIN_PASSWORD:}
# Applications proposées sur le portail après connexion (code|libellé|url), séparées par des virgules
nexora.auth.applications=${AUTH_APPLICATIONS:refdata|R\u00e9f\u00e9rentiel Commun|http://localhost:8082}
# Cookie SSO : passer à true derrière HTTPS
nexora.auth.secure-cookie=${AUTH_SECURE_COOKIE:false}

management.endpoints.web.exposure.include=health,info
info.app.name=NEXORA - Authentification unique (auth)
