spring.application.name=nexora-eservices

# Secrets locaux : .env.local à la racine de eservices (voir .env.example) ou variables d'environnement
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${ESERVICES_DB_URL:jdbc:postgresql://localhost:5432/nexora_eservices}
spring.datasource.username=${ESERVICES_DB_USER:nexora_eservices}
spring.datasource.password=${ESERVICES_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=${ESERVICES_PORT:8085}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Authentification unique NEXORA (microservice auth) : jetons vérifiés avec sa clé publique
nexora.auth.url=${AUTH_URL:http://localhost:8090}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8090/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8090}
# Services de la plateforme : studio (paquets publiés), registre des opérateurs, référentiel commun
nexora.procedures.url=${PROCEDURES_URL:http://localhost:8084}
nexora.registration.url=${REGISTRATION_URL:http://localhost:8083}
nexora.refdata.url=${REFDATA_URL:http://localhost:8082}
# Adresse publique (lien de vérification du code QR des livrables)
nexora.eservices.public-url=${ESERVICES_PUBLIC_URL:http://localhost:8085}
nexora.cors.allowed-origins=${ESERVICES_CORS:http://localhost:4205}
nexora.tenant=${NEXORA_TENANT:CM}
# Clé du cachet électronique visible (HMAC) ; à définir dans .env.local
nexora.eservices.seal-secret=${ESERVICES_SEAL_SECRET:}

# Moteur BPMN Operaton (fork communautaire de Camunda 7) embarqué : tables ACT_* créées dans la base du service
operaton.bpm.database.schema-update=true
operaton.bpm.history-level=full
operaton.bpm.auto-deployment-enabled=false
operaton.bpm.job-execution.enabled=true
operaton.bpm.job-execution.wait-time-in-millis=2000
operaton.bpm.job-execution.max-wait=10000
operaton.bpm.metrics.enabled=false
operaton.bpm.generic-properties.properties.enforce-history-time-to-live=false
operaton.bpm.generic-properties.properties.default-number-of-retries=3

management.endpoints.web.exposure.include=health,info
info.app.name=NEXORA - e-Services (eservices)
info.app.description=Execution des procedures du guichet unique : dossiers, workflow BPMN (Operaton), regles DRL (Drools), messages, paiements, livrables

# Rattachement de démonstration des agents de test à toutes les unités (si aucun agent n'est rattaché)
nexora.eservices.demo=${ESERVICES_DEMO:true}
